<div class="profile-container">

    <div class="profile-details">
        <h1>User Profile</h1>
        <button class="edit-btn" (click)="openPopUp()">Edit Info</button>
        <span>Can Özer</span>

        <button class="logout-btn" (click)="logout()">Logout</button>

</div>

<div class="previous-orders-container">
    <div class="previous-orders-details">

<div class="edit-container" [ngStyle]="{'display': displayPopUp}">
    <button class="close-btn" (click)="closePopUp()">
        <span aria-hidden="true">&times;</span>
    </button>
    <div class="edit-infos">
        <h2>Edit Profile</h2>
        <input  class="edit-name" type="new-name" placeholder="New Name">
        <input class="edit-email" type="new-email" placeholder="New Email">
        <input class="edit-phone" type="new-phone" placeholder="New Phone Number">
        <button class="submit-btn" (click)="closePopUp()">Submit</button>
    </div>
</div>
