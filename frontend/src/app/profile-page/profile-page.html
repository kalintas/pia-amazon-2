<div class="signin-page">

  <button class="back-to-home" (click)="backToHomePage()">
    Back to Home
  </button>
  
  <div class="signin-box">
    <img
      src="account_login_log_in_icon_250759.ico"
      class="signin-logo"
      alt="Logo"
    />
    <span class="signin-brand">Sign In</span>
    <input type="text" class="signin-username" placeholder="Username" />
    <input type="password" class="signin-password" placeholder="Password" />
    <button class="signin-button">Login</button>
  </div>
</div>
