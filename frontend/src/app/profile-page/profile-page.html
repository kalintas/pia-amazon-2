<button class="back-to-home" (click)="backToHomePage()">
    ← Back to Home
</button>

<div class="profile-container">
    <img src="default_pp.png" class="profile-photo" alt="Default profile photo">
    <div class="profile-details">
        <h1>User Profile</h1>
        <button class="edit-btn" (click)="openPopUp()">Edit Info</button>
        <span>{{user.name}}</span>
        <span>{{user.email}}</span>
        <span>{{user.phoneNumber}}</span>
        <button class="signout-btn" (click)="signOut()">Sign out</button>
    </div>
</div>

<div class="previous-orders-container">
    <div class="previous-orders-details">
        <h2>Previous Orders</h2>
        <p>Product 1: Toy</p>
        <p>Product 1: Toy</p>
        <p>Product 1: Toy</p>
        <p>Product 1: Toy</p>
        <p>Product 1: Toy</p>
        <p><strong>You have no previous orders.</strong></p>
    </div>
</div>

<div class="edit-container" [ngStyle]="{'display': displayPopUp}">
    <button class="close-btn" (click)="closePopUp()">
        <span aria-hidden="true">&times;</span>
    </button>
    <form (submit)="submitChanges($event)" class="edit-infos">
        <h2>Edit Profile</h2>
        <input [formControl]="userName" class="edit-name" placeholder="Name">
        <input [formControl]="userSurname" class="edit-name" placeholder="Surname">
        <input [formControl]="userEmail" class="edit-email" type="email" placeholder="Email">
        <input [formControl]="userPhoneNumber" class="edit-phone" type="tel" placeholder="Phone Number">
        <button class="submit-btn" type="submit">Submit</button>
    </form>
</div>
