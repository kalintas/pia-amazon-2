<button class="cart-btn" (click)="togleCart()">
    🛒 Cart ({{this.cartService.getItems().length}})
</button>   

<div class="icon-brand">
    <img src="favicon.ico" class="homepage-logo" alt="Logo" (click)="reloadPage()" />
    <span class="homepage-brand">Amazon 2</span>
</div>

<div class="reels-group">
    <button class="reels-btn" (click)="goToReelsPage()">
    <img src="icons8-instagram-reels-16.png" alt=""> Reels 
    </button>
    <div class="new-label">
    <span class="new-span">New</span>
    </div>
</div>  

@if (this.apiService.user()) {
    <div>
        <img src="default_pp.png" class="profile-photo" alt="Default profile photo" (click)="this.router.navigate(['/profile'])">
    </div>
} @else {
    <button class="profile-btn" (click)="this.router.navigate(['/auth'])" #authButton>
        Sign In
    </button>
}
<app-cart></app-cart>
