<button class="cart-btn" (click)="togleCart()">
    🛒 Cart ({{cartItemCount}})
</button>   

<div class="icon-brand">
    <img src="favicon.ico" class="homepage-logo" alt="Logo" />
    <span class="homepage-brand">Amazon 2</span>
    
</div>

@if (this.apiService.user()) {
    <div>
        <img src="default_pp.png" class="profile-photo" alt="Default profile photo" (click)="this.router.navigate(['/profile'])">
    </div>
} @else {
    <button class="profile-btn" (click)="this.router.navigate(['/auth'])" #authButton>
        Sign In
    </button>
}
<app-cart></app-cart>
