<app-header></app-header>

<div class="reels-modal">
    <h1 class="title">Reels</h1>
    <div class="reels-screen">
        @if (this.reel(); as reel) {
        @if (this.product(); as product) {
        <img class="reel-img" [src]="product.imageUrl" alt="" (click)="goToProductPage()" />
        <div class="info-overlay">
            <span class="reel-name">{{ product.name }}</span>
            <div class="reels-product-info">
                <span class="reel-price">{{ product.price }} $</span>
                <span class="reel-description">{{ product.description }}</span>
            </div>
        </div>
        } @else {
        <span class="loading-product">Loading Product...</span>
        }
            <button class="reaction-btn like-btn" (click)="increaseLike()">
            <img src="like-thumbs-up-hand-social-media_icon-icons.com_61429.ico" alt="Like" (click)="openSignInPopUp()"/>
            <span class="count">{{ reel.likes }}</span>
        </button>
        <button class="reaction-btn dislike-btn" (click)="increaseDislike()">
            <img src="thumbs-down-hand-social-media-dislike_icon-icons.com_61424.ico" alt="Dislike" (click)="openSignInPopUp()"/>
            <span class="count">{{ reel.dislikes }}</span>
        </button>
        <button class="reaction-btn comments-btn" (click)="commentsEnabled.set(true)">
            <img src="commentmono_105952.ico" alt="" />
            @if (Array.isArray(reel.commentsId)) {
                <span class="count">{{ reel.commentsId.length }}</span>
            }
        </button>
        }
    </div>
</div>

<div class="comments-section" [ngStyle]="{ display: commentsEnabled() ? 'flex' : 'none' }">
    <div class="comments-container">
        <button class="close-btn" (click)="commentsEnabled.set(false)">
            <span aria-hidden="true">&times;</span>
        </button>
        <h2>Comments</h2>
        <div class="comment">
            <p><strong>User1:</strong> Great reel!</p>
        </div>
        <div class="comment">
            <p><strong>User2:</strong> Loved it!</p>
        </div>
        <input class="comment-input" type="text" placeholder="Add a comment..." />
        <button class="submit-comment-btn" (click)="increaseComment()">
            Submit
        </button>
    </div>
</div>

<div class="submission-container" [ngStyle]="{'display': signInEnabled() ? 'flex' : 'none' }">
    <button class="close-btn" (click)="signInEnabled.set(false)">
        <span aria-hidden="true">&times;</span>
    </button>
    <div class="submission-details">
        <h2>You must sign first !</h2>
        <button class="ok-btn" (click)="goToSignInPage()">Sign In</button>
    </div>
</div>
