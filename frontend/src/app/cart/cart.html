<div id="cart-sidebar" class="cart-sidebar" [style.display]="open() ? 'block' : 'none'"
    [style.left]="open() ? '0' : '-400px'">

    <div class="cart-container" id="cart-container">
        <div class="cart-header">
            <h3>Shopping Cart</h3>
            <button class="cart-close-btn" (click)="open.set(false)">×</button>
        </div>
        @if (items.length === 0) {
            <div class="cart-empty">
                <p>Your cart is empty</p>
                <button class="cart-continue-shopping" (click)="open.set(false)">Continue Shopping</button>
            </div>
        } @else {
            <div class="cart-items">
            </div>
        }
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span class="cart-total-amount">${{10}}</span>
            </div>
            <div class="cart-actions">
                <button class="cart-clear-btn" (click)="clearCart()">Clear Cart</button>
                <button class="cart-checkout-btn" (click)="checkout()">Checkout</button>
            </div>
        </div>
    </div>
</div>
